quarkus:
  quinoa:
    ui-dir: src/main/webui
    build-dir: dist
    package-manager-install:
      enabled: false
    ignored-path-prefixes: /openapi-ui,/q
  swagger-ui:
    enabled: false
  datasource:
    db-kind: h2
    jdbc:
      url: jdbc:h2:mem:test
  hibernate-orm:
    database:
      generation: drop-and-create
